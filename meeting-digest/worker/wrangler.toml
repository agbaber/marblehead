name = "marblehead-meeting-digest"
main = "src/index.js"
compatibility_date = "2026-06-09"

[[d1_databases]]
binding = "DB"
database_name = "meeting-digest"
database_id = "43e9c7d3-7137-4204-84b8-214615a9c7d2"
migrations_dir = "schema"

[vars]
ALLOWED_ORIGIN = "https://marbleheaddata.org"
SITE_BASE_URL = "https://marbleheaddata.org"
GITHUB_REPO = "agbaber/marblehead"
GITHUB_BRANCH = "main"
MAIL_FROM = "Marblehead Data <digest@meetings.marbleheaddata.org>"
MAIL_REPLY_TO = "agbaber@gmail.com"
TURNSTILE_TEST_BYPASS_TOKEN = "TEST-OK"
# MAIL_PROVIDER_API_KEY is a Worker secret set via `wrangler secret put` —
# do NOT declare it as a var here, or `wrangler deploy` will overwrite the
# secret with the placeholder string and the Worker will 401 on every send.

# Friday 7:00 AM ET == 11:00 UTC (EST) / 12:00 UTC (EDT).
# Run at 11:00 and 12:00; the scheduled handler chooses one based on the
# current ET hour, the other becomes a no-op. Keeps DST handling simple.
[triggers]
crons = ["0 11 * * 5", "0 12 * * 5"]

[env.staging]
name = "marblehead-meeting-digest-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "meeting-digest-staging"
database_id = "4fac8b9d-f5e2-437f-8975-b84a05a6b225"
migrations_dir = "schema"

[env.staging.vars]
ALLOWED_ORIGIN = "*"
SITE_BASE_URL = "https://worktree-feat-digest.marbleheaddata-preview.pages.dev"
GITHUB_REPO = "agbaber/marblehead"
GITHUB_BRANCH = "main"
MAIL_FROM = "Marblehead Data (staging) <digest@meetings.marbleheaddata.org>"
MAIL_REPLY_TO = "agbaber@gmail.com"
TURNSTILE_TEST_BYPASS_TOKEN = "TEST-OK"

[env.staging.triggers]
crons = []
