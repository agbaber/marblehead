title: Marblehead Budget Data
description: Open data and charts about Marblehead, MA municipal finances
last_updated: April 26, 2026
version: "1.3.0"
url: https://marbleheaddata.org
baseurl: ""

# Cloudflare Turnstile site key (public; paired with the
# TURNSTILE_SECRET secret on the Pages project). Used by feedback.html.
turnstile_site_key: "0x4AAAAAADEi6Ymsaf-lEIvW"

plugins: []

collections:
  transcripts:
    output: true
    permalink: /meetings/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: "index.html"
    values:
      layout: home
  - scope:
      path: "charts"
    values:
      layout: chart
      community_pulse: off-sections
  - scope:
      path: ""
      type: transcripts
    values:
      layout: transcript
      community_pulse: off-sections

exclude:
  - README.md
  - STYLE_GUIDE.md
  - SOCIAL_MEDIA_PLAN.md
  - LICENSE
  - docs/
  - data/acfr/
  - data/budgets/
  - community-pulse/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
