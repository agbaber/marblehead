title: Marblehead Budget Data
description: Open data and charts about Marblehead, MA municipal finances
last_updated: April 26, 2026
version: "1.3.0"
url: https://marbleheaddata.org
baseurl: ""

# Cloudflare Turnstile site key (public; paired with the
# TURNSTILE_SECRET secret on the Pages project). Used by feedback.html.
turnstile_site_key: "0x4AAAAAADEi6Ymsaf-lEIvW"

# Meeting-digest Worker base URL. Public; referenced by subscribe.html and the
# inline subscribe form on meetings.html.
digest_worker_base: "https://marblehead-meeting-digest.agbaber.workers.dev"

# Feature flags. Flip to true once the backing endpoint exists.
# transcripts_subscribe: shows the Subscribe CTA on transcript pages.
transcripts_subscribe: true

# Mapbox public token for Static Images API (school-building-maintenance map).
# Public tokens (pk.*) are designed to be exposed in client code; this one is
# URL-restricted to marbleheaddata.org and preview domains in the Mapbox
# dashboard.
mapbox_token: "pk.eyJ1IjoiYWdiYWJlciIsImEiOiJjbXFkNzNtcTUweGIwMnBvZ3ByanN3N2oxIn0.mkfdAEIhSUxXH-TeblpX5w"

# Backing and reps widget on what-can-we-do.html. Set to "off" to hide the
# "Who's behind this" panels site-wide without removing the data. Quoted so
# YAML keeps it a string (bare on/off parse as booleans).
engagement_widget: "on"

plugins: []

collections:
  transcripts:
    output: true
    permalink: /meetings/:path/
  primers:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: "index.html"
    values:
      layout: home
  - scope:
      path: "charts"
    values:
      layout: chart
      community_pulse: off-sections
  - scope:
      path: "marblehead-101"
    values:
      community_pulse: off-sections
  - scope:
      path: ""
      type: transcripts
    values:
      layout: transcript
      community_pulse: off-sections

exclude:
  - README.md
  - STYLE_GUIDE.md
  - SOCIAL_MEDIA_PLAN.md
  - LICENSE
  - docs/
  - data/acfr/
  - data/budgets/
  - community-pulse/
  - node_modules/
  - vendor/
  - og-cards/
  - Gemfile
  - Gemfile.lock
  - proof/
