    fte: 1
    source_url: "https://marbleheadma.gov/town-administrator/"
    source_label: "Town of Marblehead, Town Administrator page (accessed June 2026)"
    note: >-
      Chief Administrative Officer; appointed by the Select Board. Oversees
      daily operations of building inspections, community development &
      planning, council on aging, finance, fire, harbormaster, human
      resources, police, public works, public buildings, and veterans
      services.
