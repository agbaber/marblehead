# Marblehead organizational chart data.
#
# Sources:
#   - Town department list: marbleheadma.gov navigation (accessed 2026-06-14)
#   - Town head counts: data/town_employee_headcount_FY08-26.csv (FY2026 column),
#     derived from data/employee_count_FY2008-2026.xls (town payroll system).
#     These are HEADCOUNT (including PT and seasonal), not FTE. FTE-only
#     numbers at department granularity are not published in primary sources;
#     ACFR FTE schedules (data/fte_employees_FY15-24.csv) bucket by category.
#   - School central office + buildings: marbleheadschools.org/administration
#     and marbleheadschools.org/schools (accessed 2026-06-14), cross-checked
#     against the FY27 budget packet personnel pages
#     (data/schools/sc-meetings-fy26/agenda-and-materials-2-5-2026-fy27-budget-packet.txt).
#   - School total FTE: data/dese_total_educator_fte.csv (DESE EPIMS, SY2026 = 430.2).
#   - Boards: each board's marbleheadma.gov page (URLs below).
#
# IMPORTANT: roles only, no personal names. The page rendered from this file
# is descriptive of the structure, not a staff directory.

key_stats:
  snapshot: "2026-06-14"
  town_departments: 21
  school_buildings: 5
  elected_seats: 39
  # Sum across elected boards: Select Board 5 + Town Moderator 1 + Town Clerk 1
  # + School Committee 5 + Planning Board 5 + Cemetery Commission 3
  # + Light Commission 3 + Water & Sewer Commission 5 + Recreation & Park
  # Commission 5 + Library Trustees 6 = 39. Housing Authority adds 5 more
  # (4 elected + 1 governor-appointed) but is a separate authority, not a
  # town board, so it is not counted in this total.
  registered_voters: 17040
  registered_voters_source_url: "https://www.marbleheadindependent.com/2026-election-polls-open-until-8-p-m-heres-everything-on-marbleheads-ballot/"
  registered_voters_source_label: >-
    Marblehead Independent, June 9, 2026 election coverage: 'Marblehead's
    17,040 registered voters.'

town:
  cluster_order:
    - "Administration & Finance"
    - "Public Safety"
    - "Public Works"
    - "Land Use & Health"
    - "Community Services"
  head:
    title: "Town Administrator"
    fte: 1
    source_url: "https://marbleheadma.gov/town-administrator/"
    source_label: "Town of Marblehead, Town Administrator page (accessed June 2026)"
    note: >-
      Chief Administrative Officer; appointed by the Select Board. Oversees
      daily operations of building inspections, community development &
      planning, council on aging, finance, fire, harbormaster, human
      resources, police, public works, public buildings, and veterans
      services.
  departments:
    - name: "Finance"
      cluster: "Administration & Finance"
      head_title: "Finance Director / CFO"
      fte: 9
      fte_basis: "FY2026 headcount (includes PT)"
      staff:
        - "Town Accountant"
        - "Treasurer / Tax Collector"
        - "Assistant Treasurer / Collector"
        - "Chief Assessor"
        - "Administrative Assessor"
        - "Senior Clerk, Assessor"
        - "Payroll Administrator"
        - "Administrative Clerk, Payroll"
        - "IT & Communications Specialist"
        - "Accounting Assistant"
        - "Accounting & Website Assistant"
        - "Retirement Administrator"
        - "Senior Clerk, Treasurer / Collector (×2)"
      source_url: "https://marbleheadma.gov/finance-department/"
      source_label: "Town of Marblehead, Finance Department page; FY26 headcount from data/town_employee_headcount_FY08-26.csv; staff roster from Annual Report 2025 (Financial Services Department Staff list)"
      note: >-
        Finance Director also serves as Chief Financial Officer; the town
        has no dedicated IT department, so IT effectively reports through
        Finance.
    - name: "Assessors' Office"
      cluster: "Administration & Finance"
      head_title: "Chief Assessor"
      fte: 3
      fte_basis: "FY2026 headcount"
      staff:
        - "Administrative Assessor"
        - "Senior Clerk"
      source_url: "https://marbleheadma.gov/assessors-office/"
      source_label: "Town of Marblehead, Assessor's Office page; staff roster from Annual Report 2025 (Financial Services Department, assessing positions)"
      note: >-
        Assessing operations roll up under the Finance Director / CFO in
        the Financial Services Department. The elected three-member Board
        of Assessors sets policy; see Boards section.
    - name: "Town Clerk + Elections"
      cluster: "Administration & Finance"
      head_title: "Town Clerk"
      fte: 3
      fte_basis: "FY2026 headcount (year-round)"
