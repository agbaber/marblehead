      source_label: "Town of Marblehead, Finance Department page; FY27 position lines from MUNIS budget detail (data/_enrichment/fy27_personnel.yml, FINANCE cost center)"
      note: >-
        Finance Director also serves as Chief Financial Officer; the town
        has no dedicated IT department, so IT effectively reports through
        Finance. The FY27 budget consolidates the Assistant Department
        Head line into a Division Head / Assistant Division Head split;
        not a layoff per se. Note: the Override Presentation narrates a
        Senior Clerk cut in Finance, but the MUNIS Senior Clerk dollar
        figure went UP year-over-year. The cut likely affects a
        multi-clerk Treasurer/Collector sub-pool that stays funded as a
