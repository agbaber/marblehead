boards:
  emphasized:
    - name: "Select Board"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Sets town policy, signs the warrant for Town Meeting, hires and
        evaluates the Town Administrator, makes most non-school appointments
        to boards and committees, and represents the town in
        intergovernmental matters.
      cadence: "Typically meets twice monthly (Wednesday evenings)"
      override_role: >-
        Votes to place a Proposition 2 1/2 override or debt-exclusion
        question on the ballot, and authors the override warrant article.
        For the FY27 cycle, the Select Board placed the structured
        three-tier override package before voters.
      source_url: "https://marbleheadma.gov/selectboard-office/"
      source_label: "Town of Marblehead, Select Board Office"
    - name: "School Committee"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Hires and evaluates the Superintendent, sets school district policy,
        votes the school operating budget request that goes to Town Meeting,
        and acts as the employer of record for collective bargaining with
        teacher and staff unions. Under MGL c.71 sec.34 the committee
        controls expenditures within the appropriated lump sum.
      cadence: "Generally 1st and 3rd Thursday each month at 6 pm"
      override_role: >-
        Sets the school department's budget request, which is the largest
        single driver of the FY27 deficit. School Committee members
        publicly advocate for the override but cannot place it on the
        ballot themselves; that is the Select Board's role.
      source_url: "https://www.marbleheadschools.org/school-committee"
      source_label: "Marblehead Public Schools, School Committee page; member count and term from /school-committee/committee-subcommittee-members"
    - name: "Finance Committee"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 9
      term_years: 3
      decides: >-
        Reviews all town department budgets and warrant articles requiring
        town funds, holds public hearings, and publishes written
        recommendations (favor / opposed / table) to Town Meeting voters.
        Functions in an advisory capacity for all financial matters.
      cadence: "Meets through the budget cycle; cadence not formally published"
      override_role: >-
        Issues a recommendation on the override warrant article. The
        FinCom's analysis of revenue, fixed costs, and reserve levels is
        the most-cited fiscal source in the override debate.
      source_url: "https://marbleheadma.gov/finance-committee/"
      source_label: >-
        Town of Marblehead, Finance Committee page; appointing-authority
        verified by recent Select Board minutes
        (data/minutes/select_board/2026-01-14.cleaned.txt and others
        confirm Select Board appointments)
      note: >-
        In many Massachusetts towns the Finance Committee is appointed by
        the Town Moderator. In Marblehead it is appointed by the Select
        Board, per the Finance Committee's official page and consistent
        with recent Select Board minutes that record FinCom appointments.
