# Marblehead organizational chart data.
#
# Sources:
#   - Town department list: marbleheadma.gov navigation (accessed 2026-06-14)
#   - Town head counts: data/town_employee_headcount_FY08-26.csv (FY2026 column),
#     derived from data/employee_count_FY2008-2026.xls (town payroll system).
#     These are HEADCOUNT (including PT and seasonal), not FTE. FTE-only
#     numbers at department granularity are not published in primary sources;
#     ACFR FTE schedules (data/fte_employees_FY15-24.csv) bucket by category.
#   - School central office + buildings: marbleheadschools.org/administration
#     and marbleheadschools.org/schools (accessed 2026-06-14), cross-checked
#     against the FY27 budget packet personnel pages
#     (data/schools/sc-meetings-fy26/agenda-and-materials-2-5-2026-fy27-budget-packet.txt).
#   - School total FTE: data/dese_total_educator_fte.csv (DESE EPIMS, SY2026 = 430.2).
#   - Boards: each board's marbleheadma.gov page (URLs below).
#
# IMPORTANT: roles only, no personal names. The page rendered from this file
# is descriptive of the structure, not a staff directory.

key_stats:
  snapshot: "2026-06-14"
  town_departments: 23
  school_buildings: 5
  elected_seats: 41
  # Sum across elected boards: Select Board 5 + Town Moderator 1 + Town Clerk 1
  # + School Committee 5 + Planning Board 5 + Cemetery Commission 3
  # + Light Commission 5 + Water & Sewer Commission 5 + Recreation & Park
  # Commission 5 + Library Trustees 6 = 5 + 1 + 1 + 5 + 5 + 3 + 5 + 5 + 5 + 6
  # = 41. Housing Authority adds 5 more (4 elected + 1 governor-appointed)
  # but is a separate authority, not a town board, so it is not counted in
  # this total. (Light Commission corrected from 3 to 5 seats per the 2025
  # Town Annual Report MMLD chapter, page 245.)
  registered_voters: 17040
  registered_voters_source_url: "https://www.marbleheadindependent.com/2026-election-polls-open-until-8-p-m-heres-everything-on-marbleheads-ballot/"
  registered_voters_source_label: >-
    Marblehead Independent, June 9, 2026 election coverage: 'Marblehead's
    17,040 registered voters.'

town:
