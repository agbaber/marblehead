boards:
  emphasized:
    - id: select_board
      name: "Select Board"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Sets town policy, signs the warrant for Town Meeting, hires and
        evaluates the Town Administrator, makes most non-school appointments
        to boards and committees, and represents the town in
        intergovernmental matters.
      cadence: "Typically meets twice monthly (Wednesday evenings)"
      override_role: >-
        Votes to place a Proposition 2 1/2 override or debt-exclusion
        question on the ballot, and authors the override warrant article.
        For the FY27 cycle, the Select Board placed the structured
        three-tier override package before voters.
      source_url: "https://marbleheadma.gov/selectboard-office/"
      source_label: "Town of Marblehead, Select Board Office"
      decision_flow_data:
        hires_executive:
          title: "Town Administrator"
          incumbent:
            name: "Thatcher W. Kezer III"
            since: 2022
            since_note: "Began as Town Administrator in June 2022 per the Annual Report 2025."
            until: 2026
            until_note: >-
              Retiring effective December 31, 2026. Announced June 15,
              2026 per the Marblehead Current and Itemlive. His three-year
              contract (signed June 2025) was set to run through June 2028;
              he is departing about 1 1/2 years early. The Select Board has
              begun the recruitment process for a successor.
            until_badge: "retiring Dec 31, 2026"
        reach: >-
          ~20 town departments, but only through the Town Administrator.
          Day-to-day operations are the TA's job, not the board's.
        sitting:
          - name: "Erin Marie Noonan"
            since: 2021
            since_note: "First elected June 2021; re-elected at the June 9, 2026 Annual Town Election with 4,854 votes (the field leader)."
            term_ends: 2029
          - name: "Rossana Ferrante"
            since: 2026
            since_note: "Newly elected at the June 9, 2026 Annual Town Election with 4,387 votes. Previously served on the Recreation & Park Commission. Replaces Alexa J. Singer (2021-2026), who did not run for re-election."
            term_ends: 2029
          - name: "Moses Grader"
            since: 2017
            since_note: "Elected May 2017 to fill the seat Bret Murray vacated, per Annual Report 2017."
            term_ends: 2027
          - name: "Daniel Fox"
            since: 2024
            term_ends: 2027
          - name: "James Richard Zisson"
            since: 2025
            since_note: "Elected to a three-year term at the June 2025 Annual Election."
            term_ends: 2028
        can:
          - "Place a Prop 2 1/2 override on the ballot"
          - "Sign the Town Meeting warrant"
          - "Appoint the Finance Committee and most non-school boards and committees"
          - "Hire, evaluate, and fire the Town Administrator"
        cannot:
          - "Direct the schools, set the school budget, or hire any school staff"
          - "Direct the Light Department or set electric rates"
        sources:
          - url: "https://marbleheadma.gov/wp-content/uploads/2026/06/Town-election-official-results-June-9-2026.pdf"
            label: "Town of Marblehead, certified June 9, 2026 Town Election Official Results (saved at data/town_docs/elections/2026-06-09-town-election-official-results.pdf): Erin Noonan re-elected (4,854 votes) and Rossana Ferrante newly elected (4,387 votes) to three-year terms."
          - url: "https://marbleheadma.gov/wp-content/uploads/2026/05/Annual-Report-2025.pdf"
            label: "Town of Marblehead 2025 Annual Report (data/town_docs/annual_reports/Annual-Report-2025.txt, pages 93-100): roster of Moses Grader (term 2027), Daniel Fox (term 2027), and James Richard Zisson (term 2028); Thatcher W. Kezer III as Town Administrator since June 2022."
          - url: "https://marbleheadcurrent.org/2026/06/15/breaking-news-town-administrator-announces-resignation-at-end-of-year/"
            label: "Marblehead Current, June 15, 2026: Town Administrator Thatcher W. Kezer III announces retirement effective December 31, 2026, leaving 1 1/2 years before his three-year contract was set to end."
    - id: school_committee
      name: "School Committee"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Hires and evaluates the Superintendent, sets school district policy,
        votes the school operating budget request that goes to Town Meeting,
        and acts as the employer of record for collective bargaining with
        teacher and staff unions. Under MGL c.71 sec.34 the committee
        controls expenditures within the appropriated lump sum.
      cadence: "Generally 1st and 3rd Thursday each month at 6 pm"
      override_role: >-
        Sets the school department's budget request, which is the largest
        single driver of the FY27 deficit. School Committee members
        publicly advocate for the override but cannot place it on the
        ballot themselves; that is the Select Board's role.
      source_url: "https://www.marbleheadschools.org/school-committee"
      source_label: "Marblehead Public Schools, School Committee page; member count and term from /school-committee/committee-subcommittee-members"
      decision_flow_data:
        hires_executive:
          title: "Superintendent"
          incumbent:
            name: "John Robidoux"
            since: 2025
            since_note: "Permanent Superintendent under a three-year contract effective July 1, 2025; previously served as Interim Superintendent."
            until: 2028
            until_note: "Three-year contract through June 30, 2028 per data/schools/superintendent/john-robidoux-contract.txt."
        reach: >-
          ~430 school staff, but only through the Superintendent. The
          Superintendent is the sole employer for every teacher,
          principal, and aide in the district.
        sitting:
          - name: "Melissa Clucas"
            since: 2025
            since_note: "First joined the committee in 2025 by appointment to fill Brian Scott Ota's vacancy (he resigned July 2025; she was seated by the December 18, 2025 SC meeting). Elected to a full three-year term at the June 9, 2026 Annual Town Election with 5,305 votes."
            term_ends: 2029
          - name: "Ann Marie Jordan"
            since: 2026
            since_note: "Newly elected at the June 9, 2026 Annual Town Election with 5,088 votes. Replaces Jennifer Schaeffner (2023-2026), who ran for Select Board instead but did not win."
            term_ends: 2029
          - name: "Alfred Williams"
            since: 2024
            term_ends: 2027
          - name: "Katherine B. Schmeckpeper"
            since: 2025
            term_ends: 2028
          - name: "Henry Gwazda"
            since: 2025
            term_ends: 2028
        can:
          - "Set the school operating budget request that goes to Town Meeting"
          - "Approve collective bargaining agreements with school unions"
          - "Hire, evaluate, and fire the Superintendent"
        cannot:
          - "Hire or fire any teacher, principal, or other school staff (the 1993 Massachusetts Education Reform Act assigns that authority to the Superintendent)"
          - "Place an override on the ballot (that is the Select Board's role)"
        sources:
          - url: "https://marbleheadma.gov/wp-content/uploads/2026/06/Town-election-official-results-June-9-2026.pdf"
            label: "Town of Marblehead, certified June 9, 2026 Town Election Official Results (data/town_docs/elections/2026-06-09-town-election-official-results.pdf): Melissa Clucas (5,305 votes) and Ann Marie Jordan (5,088 votes) elected to three-year terms; Jennifer Schaeffner ran for Select Board instead (2,611 votes) and did not win."
          - url: "https://marbleheadma.gov/wp-content/uploads/2026/05/Annual-Report-2025.pdf"
            label: "Town of Marblehead 2025 Annual Report (data/town_docs/annual_reports/Annual-Report-2025.txt, page 95): roster of Alfred Williams (term 2027), Katherine B. Schmeckpeper (term 2028), and Henry Gwazda (term 2028)."
          - url: "https://www.marbleheadschools.org/superintendent"
            label: "John Robidoux Superintendent contract effective July 1, 2025 through June 30, 2028 (data/schools/superintendent/john-robidoux-contract.txt); previously served as Interim Superintendent."
          - url: "https://www.marbleheadschools.org/school-committee"
            label: "Marblehead School Committee meeting minutes, December 18, 2025 (data/schools/sc-meetings-fy26/minutes-12-18-2025.txt): first meeting at which Melissa Clucas is listed as a sitting committee member, by appointment to fill the Brian Ota vacancy."
    - name: "Finance Committee"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 9
      term_years: 3
      decides: >-
        Reviews all town department budgets and warrant articles requiring
        town funds, holds public hearings, and publishes written
        recommendations (favor / opposed / table) to Town Meeting voters.
        Functions in an advisory capacity for all financial matters.
      cadence: "Meets through the budget cycle; cadence not formally published"
      override_role: >-
        Issues a recommendation on the override warrant article. The
        FinCom's analysis of revenue, fixed costs, and reserve levels is
        the most-cited fiscal source in the override debate.
      source_url: "https://marbleheadma.gov/finance-committee/"
      source_label: >-
        Town of Marblehead, Finance Committee page; appointing-authority
        verified by recent Select Board minutes
        (data/minutes/select_board/2026-01-14.cleaned.txt and others
        confirm Select Board appointments)
      note: "In most Massachusetts towns the Finance Committee is appointed by the Town Moderator. In Marblehead it is appointed by the Select Board."
  other:
    - name: "Town Moderator"
      kind: "elected"
      seats: 1
      term_years: 1
      decides: >-
        Presides over Annual and Special Town Meetings, decides questions
        of order, and declares votes. May appoint residents to special
        committees at the request of Town Meeting.
      cadence: "Active at Town Meetings and called Special Town Meetings"
      source_url: "https://marbleheadma.gov/moderator/"
      source_label: "Town of Marblehead, Town Moderator page"
    - name: "Town Clerk"
      kind: "elected"
      seats: 1
      term_years: 3
      decides: >-
        Custodian of town records, conducts town elections, certifies
        votes, records vital statistics, and prepares the ballot for town
        elections.
      cadence: "Office function; not a deliberative board"
      source_url: "https://marbleheadma.gov/town-clerk/"
      source_label: "Town of Marblehead, Town Clerk page"
    - name: "Planning Board"
      kind: "elected"
      seats: 5
      term_years: null
      term_years_null_reason: >-
        Marblehead's Town Planning Board page describes a five-member
        elected board including a Chair and Associate Member but does
        not publish term length on its page. Statutory default under
        MGL c.41 sec.81A is 5 years.
      decides: >-
        Approves land divisions, nonresidential buildings over 700 sq ft,
        residential construction over 500 sq ft in shoreline/harbor
        districts, smart growth special permits, wireless communication
        special permits, and incentive zoning special permits.
      cadence: "Monthly meetings"
      source_url: "https://marbleheadma.gov/town-planning-board/"
      source_label: "Town of Marblehead, Town Planning Board"
    - name: "Board of Health"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 3
      term_years: null
      term_years_null_reason: "Term length not published on the Board of Health page."
      decides: >-
        Enforces state and local health regulations, licenses food
        establishments, oversees septic and tobacco regulations, and
        responds to public health emergencies.
      cadence: "Second Tuesday of each month at 7:30 pm (Mary Alley Municipal Building)"
      source_url: "https://marbleheadma.gov/board-of-health/"
      source_label: "Town of Marblehead, Board of Health"
    - name: "Board of Assessors"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 3
      term_years: null
      term_years_null_reason: "Term length not specified on the Board of Assessors page."
      decides: >-
        Sets and certifies property valuations, classifies real and
        personal property, and rules on abatement applications.
      cadence: "Monthly meetings during the abatement cycle"
      source_url: "https://marbleheadma.gov/board-of-assessors/"
      source_label: "Town of Marblehead, Board of Assessors"
    - name: "Zoning Board of Appeals"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 5
      term_years: 5
      decides: >-
        Hears variance requests, special permit applications, and appeals
        of Building Commissioner decisions. May grant relief only when
        proposed changes will not adversely affect the neighborhood.
      cadence: "Monthly hearings"
      source_url: "https://marbleheadma.gov/zoning-board-of-appeals/"
      source_label: "Town of Marblehead, Zoning Board of Appeals (5 members + 4 alternates, 5-year staggered terms)"
    - name: "Conservation Commission"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 7
      term_years: 3
      decides: >-
        Manages and protects town conservation lands and administers
        wetlands protection laws and stormwater guidelines for
        construction projects affecting wetlands.
      cadence: "Second Thursday of each month at 7 pm (Zoom)"
      source_url: "https://marbleheadma.gov/conservation-commission/"
      source_label: "Town of Marblehead, Conservation Commission"
    - name: "Historical Commission"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 7
      term_years: 3
      decides: >-
        Identifies, evaluates, and protects historic resources; reviews
        demolition requests under the town's demolition delay bylaw;
        nominates properties to historic registers.
      cadence: "Monthly meetings"
      source_url: "https://marbleheadma.gov/historical-commission/"
      source_label: "Town of Marblehead, Historical Commission"
    - name: "Recreation & Park Commission"
      kind: "elected"
      seats: 5
      term_years: 1
      decides: >-
        Oversees the Recreation & Parks Department, appoints the
        Superintendent annually, sets fees and policies for town
        recreation programs and park use.
      cadence: "Monthly meetings"
      source_url: "https://marbleheadma.gov/recreation-parks/"
      source_label: >-
        Town of Marblehead, Recreation & Parks Department; election
        warrant in Select Board minutes 2025-05-06 confirms 5 seats for
        1-year terms
    - name: "Cemetery Commission"
      kind: "elected"
      seats: 3
      term_years: 3
      decides: >-
        Oversees town cemeteries, sets policies for burials and lot
        sales, and appoints the Cemetery Superintendent.
      cadence: "Quarterly or as needed"
      source_url: "https://marbleheadma.gov/cemetery-commission/"
      source_label: "Town of Marblehead, Cemetery Commission"
    - id: light_commission
      name: "Light Commission"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Governs the Marblehead Municipal Light Department; sets electric
        rates, approves the MMLD operating budget directly (not subject to
        Select Board oversight or Town Meeting appropriation), and oversees
        long-range planning for the town's municipal electric utility.
      cadence: "Monthly meetings"
      source_url: "https://marbleheadelectric.com/"
      source_label: >-
        Town of Marblehead 2025 Annual Report, MMLD chapter (page 245)
        signs out with five commissioners (Chair, Vice Chair, Secretary,
        and two Members); the 2024 MMLD Annual Report likewise lists five.
        The earlier '3 seats' figure on this page was incorrect.
      decision_flow_data:
        hires_executive:
          title: "General Manager"
          incumbent:
            name: "Jonathan Blair"
            since: 2025
            since_note: "Started September 29, 2025 under a five-year contract with the Light Commission, per the Marblehead Current (July 23, 2025) and Marblehead Independent (September 2025)."
            until: 2030
            until_note: "Five-year contract from September 29, 2025 through approximately September 2030."
        reach: >-
          19 employees through the General Manager. A separate municipal
