# Decision-flow panel. Distinct from the staffing tree above: this captures
# the actual reporting hierarchy (who hires whom, who can decide what), not
# the headcount tree. All claims here are restatements of facts already
# sourced in the boards/head/independent_enterprises sections above.
decision_flow:
  intro: >-
    The chart above shows who works for whom. This panel shows who
    decides what. Three elected boards each hire exactly one
    operational executive, and only Town Meeting can appropriate money.
  voters:
    title: "Voters"
    count_note: "About 17,040 registered, per the boards section above."
    elect:
      - "Select Board (5 seats, 3-year terms)"
      - "School Committee (5 seats, 3-year terms)"
      - "Light Commission (5 seats, 3-year terms)"
      - "Town Moderator, Town Clerk, Planning Board, and other elected seats listed below"
    decide_directly:
      - "Town Meeting: every appropriation, every bylaw, every warrant article"
      - "Annual ballot: Prop 2 1/2 overrides, debt exclusions, charter changes"
  # Decision-flow pillars are looked up against the unified `boards`
  # list above by id. Each board's `decision_flow_data` block holds
  # the per-pillar fields (hires_executive, reach, sitting, can/cannot,
  # sources). The same `sitting` and `decision_flow_data` data is
  # then available to the boards-below section when we extend it to
  # show members, so there's no double-maintenance.
  pillar_ids:
    - select_board
    - school_committee
    - light_commission
  town_meeting_note: >-
    Every registered voter is a member of Town Meeting. This is the
    only body in Marblehead that can appropriate town tax revenue.
    Boards can propose budgets and the Finance Committee can recommend,
    but the actual appropriation vote happens on the Town Meeting floor.
  callouts:
    - title: "Asymmetric oversight"
      body: >-
        The Select Board oversees roughly 20 department heads through
        the Town Administrator. The School Committee oversees exactly
        one employee, the Superintendent. Override conversations often
        talk past each other because the two sides picture very
        different command structures.
    - title: "Marblehead's unusual Finance Committee"
      body: >-
        The Association of Town Finance Committees' handbook surveyed
        Massachusetts towns and found that of 97 appointed Finance
        Committees, 70 are appointed by the Town Moderator, 13 by the
        Board of Selectmen, and 10 by some combination of officials.
        Marblehead is in the 13. That keeps its FinCom structurally
        closer to the Select Board than is typical statewide, even
        though the committee still votes its own recommendations and
        is advisory only.
      source_url: "https://www.southboroughma.gov/DocumentCenter/View/899/MMA-Finance-Committee-Handbook-PDF"
      source_label: >-
        Association of Town Finance Committees (a chapter of the
        Massachusetts Municipal Association), Finance Committee
        Handbook, Chapter 3, page 18: of the towns responding to the
        survey, 97 finance committees are appointed and only 21 are
        elected; 70 of the appointed committees are appointed by the
        town moderator, 13 by the board of selectmen, and 10 by a
        combination of the selectmen, town moderator, and finance
        committee chair or other town officials. Local copy saved at
        data/external/atfc-finance-committee-handbook.txt (pdftotext
        layout dump of the southboroughma.gov hosted edition).
  # Per-pillar `sources:` arrays carry the inline cite markers; they
  # roll up into the auto-injected page-bottom Sources footer via
  # assets/citations.js. First-seen years on elected members are
  # derived from scripts/extract_officials_history.py (greps annual
  # reports 2006-2025); members seated before 2006 cannot be precisely
  # dated by that method.
