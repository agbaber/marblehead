boards:
  emphasized:
    - name: "Select Board"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Sets town policy, signs the warrant for Town Meeting, hires and
        evaluates the Town Administrator, makes most non-school appointments
        to boards and committees, and represents the town in
        intergovernmental matters.
      cadence: "Typically meets twice monthly (Wednesday evenings)"
      override_role: >-
        Votes to place a Proposition 2 1/2 override or debt-exclusion
        question on the ballot, and authors the override warrant article.
        For the FY27 cycle, the Select Board placed the structured
        three-tier override package before voters.
      source_url: "https://marbleheadma.gov/selectboard-office/"
      source_label: "Town of Marblehead, Select Board Office"
    - name: "School Committee"
      kind: "elected"
      seats: 5
      term_years: 3
      decides: >-
        Hires and evaluates the Superintendent, sets school district policy,
        votes the school operating budget request that goes to Town Meeting,
        and acts as the employer of record for collective bargaining with
        teacher and staff unions. Under MGL c.71 sec.34 the committee
        controls expenditures within the appropriated lump sum.
      cadence: "Generally 1st and 3rd Thursday each month at 6 pm"
      override_role: >-
        Sets the school department's budget request, which is the largest
        single driver of the FY27 deficit. School Committee members
        publicly advocate for the override but cannot place it on the
        ballot themselves; that is the Select Board's role.
      source_url: "https://www.marbleheadschools.org/school-committee"
      source_label: "Marblehead Public Schools, School Committee page; member count and term from /school-committee/committee-subcommittee-members"
    - name: "Finance Committee"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 9
      term_years: 3
      decides: >-
        Reviews all town department budgets and warrant articles requiring
        town funds, holds public hearings, and publishes written
        recommendations (favor / opposed / table) to Town Meeting voters.
        Functions in an advisory capacity for all financial matters.
      cadence: "Meets through the budget cycle; cadence not formally published"
      override_role: >-
        Issues a recommendation on the override warrant article. The
        FinCom's analysis of revenue, fixed costs, and reserve levels is
        the most-cited fiscal source in the override debate.
      source_url: "https://marbleheadma.gov/finance-committee/"
      source_label: >-
        Town of Marblehead, Finance Committee page; appointing-authority
        verified by recent Select Board minutes
        (data/minutes/select_board/2026-01-14.cleaned.txt and others
        confirm Select Board appointments)
      note: >-
        In many Massachusetts towns the Finance Committee is appointed by
        the Town Moderator. In Marblehead it is appointed by the Select
        Board, per the Finance Committee's official page and consistent
        with recent Select Board minutes that record FinCom appointments.
  other:
    - name: "Town Moderator"
      kind: "elected"
      seats: 1
      term_years: 1
      decides: >-
        Presides over Annual and Special Town Meetings, decides questions
        of order, and declares votes. May appoint residents to special
        committees at the request of Town Meeting.
      cadence: "Active at Town Meetings and called Special Town Meetings"
      source_url: "https://marbleheadma.gov/moderator/"
      source_label: "Town of Marblehead, Town Moderator page"
    - name: "Town Clerk"
      kind: "elected"
      seats: 1
      term_years: 3
      decides: >-
        Custodian of town records, conducts town elections, certifies
        votes, records vital statistics, and prepares the ballot for town
        elections.
      cadence: "Office function; not a deliberative board"
      source_url: "https://marbleheadma.gov/town-clerk/"
      source_label: "Town of Marblehead, Town Clerk page"
    - name: "Planning Board"
      kind: "elected"
      seats: 5
      term_years: null
      term_years_null_reason: >-
        Marblehead's Town Planning Board page describes a five-member
        elected board including a Chair and Associate Member but does
        not publish term length on its page. Statutory default under
        MGL c.41 sec.81A is 5 years.
      decides: >-
        Approves land divisions, nonresidential buildings over 700 sq ft,
        residential construction over 500 sq ft in shoreline/harbor
        districts, smart growth special permits, wireless communication
        special permits, and incentive zoning special permits.
      cadence: "Monthly meetings"
      source_url: "https://marbleheadma.gov/town-planning-board/"
      source_label: "Town of Marblehead, Town Planning Board"
    - name: "Board of Health"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 3
      term_years: null
      term_years_null_reason: "Term length not published on the Board of Health page."
      decides: >-
        Enforces state and local health regulations, licenses food
        establishments, oversees septic and tobacco regulations, and
        responds to public health emergencies.
      cadence: "Second Tuesday of each month at 7:30 pm (Mary Alley Municipal Building)"
      source_url: "https://marbleheadma.gov/board-of-health/"
      source_label: "Town of Marblehead, Board of Health"
    - name: "Board of Assessors"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 3
      term_years: null
      term_years_null_reason: "Term length not specified on the Board of Assessors page."
      decides: >-
        Sets and certifies property valuations, classifies real and
        personal property, and rules on abatement applications.
      cadence: "Monthly meetings during the abatement cycle"
      source_url: "https://marbleheadma.gov/board-of-assessors/"
      source_label: "Town of Marblehead, Board of Assessors"
    - name: "Zoning Board of Appeals"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 5
      term_years: 5
      decides: >-
        Hears variance requests, special permit applications, and appeals
        of Building Commissioner decisions. May grant relief only when
        proposed changes will not adversely affect the neighborhood.
      cadence: "Monthly hearings"
      source_url: "https://marbleheadma.gov/zoning-board-of-appeals/"
      source_label: "Town of Marblehead, Zoning Board of Appeals (5 members + 4 alternates, 5-year staggered terms)"
    - name: "Conservation Commission"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 7
      term_years: 3
      decides: >-
        Manages and protects town conservation lands and administers
        wetlands protection laws and stormwater guidelines for
        construction projects affecting wetlands.
      cadence: "Second Thursday of each month at 7 pm (Zoom)"
      source_url: "https://marbleheadma.gov/conservation-commission/"
      source_label: "Town of Marblehead, Conservation Commission"
    - name: "Historical Commission"
      kind: "appointed"
      appointed_by: "Select Board"
      seats: 7
      term_years: 3
      decides: >-
        Identifies, evaluates, and protects historic resources; reviews
        demolition requests under the town's demolition delay bylaw;
        nominates properties to historic registers.
      cadence: "Monthly meetings"
