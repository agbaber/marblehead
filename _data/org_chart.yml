      source_label: "Town of Marblehead, Town Clerk + Elections pages"
      note: >-
        Town Clerk is an elected position (3-year term). Elections are
        administered by the Town Clerk's office; ~25 poll workers are paid
        during election cycles but are not year-round staff.
    - name: "Human Resources"
