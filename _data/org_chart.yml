      headcount_approx_basis: >-
        FY26 town payroll rows tagged to Light operations sum to roughly
        16-18 people across multiple line items (594 Underground, 593
        Overhead, Meter, Admin, Distribution Mgmt). MMLD does not publish
        an official organizational total on its site.
