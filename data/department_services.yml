    Brown Elementary School serves grades Pre-K through 3, one of Marblehead
    Public Schools' two Pre-K-3 elementary schools.
  source_url: https://brown.marbleheadschools.org
  source_label: "Marblehead Public Schools, Brown Elementary (accessed 2026-08-04)"
