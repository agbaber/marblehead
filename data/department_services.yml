# What each department does — plain-language service descriptions for
# departments.html, read from each department's own Town of Marblehead page (or,
# for school buildings, marbleheadschools.org) at write time, not from memory.
# `source_url` / `source_label` cite the page. Accounting and board lines that
# have no service page get a short factual definition, cited to the budget.
#
# The functional breakdown (who does patrol vs dispatch vs crossings) is also
# carried by the FY27 position roster shown alongside on the page, sourced
# separately from org_chart.yml.
#
# `deep_dive` points a department at a fuller dedicated page on this site where
# one exists (Abbot Public Library -> /library.html; the schools -> /schools-budget.html).

police:
  # Functions trace to the FY27 position roster shown below; programs trace to
  # the police page. Both are cited in source_label.
  summary: >-
    Patrol and criminal investigation, staffed by patrol officers, sergeants,
    and lieutenants (detectives work within the patrol pool); an in-house E-911
    emergency dispatch center run by eight telecommunicators; traffic
    enforcement and part-time school-crossing supervision; and animal control.
    The department also runs a free eight-week Citizens Police Academy for
    residents, handles firearms licensing, and takes crime reports. It describes
    its focus as community policing and the protection of lives and property.
  source_url: https://marbleheadma.gov/police/
  source_label: "Town of Marblehead, Police Department page (mission and programs); day-to-day functions per the FY27 position roster below (accessed 2026-07-16)"

fire:
  summary: >-
    Fire suppression, emergency medical response, and rescue, staffed 24 hours.
    All personnel are certified EMTs and both front-line engines double as
    ambulances (defibrillators, Narcan, EpiPens). The department runs vehicle
    extrication and water rescue with a public safety boat, fire-prevention
    inspections, and public education. Its "First Night is On Us" program gives
    any resident whose home is temporarily uninhabitable from fire or flood
    complimentary first-night lodging.
  source_url: https://marbleheadma.gov/fire/
  source_label: "Town of Marblehead, Fire Department page (accessed 2026-07-16)"

public_works_ops:
  summary: >-
    Maintains the town's public ways, storm-sewer (drainage) infrastructure,
    public shade trees, and the municipal vehicle fleet, and coordinates road
    snow and storm operations. Work is organized into Highway, Stormwater, Town
    Engineer, and Tree divisions. (Water, sewer, cemetery, and curbside trash
    are separate budget departments.)
  source_url: https://marbleheadma.gov/dpw/
  source_label: "Town of Marblehead, Department of Public Works page (accessed 2026-07-16)"

library:
  # Deferred to the dedicated /library.html page, which carries the sourced
  # staffing / hours / funding detail. Keep the explorer summary generic-true.
  summary: >-
    Abbot Public Library lends books and media, runs public programs, and
    provides public computers and study space.
  deep_dive:
    url: /library.html
    label: "Abbot Public Library: full page (staffing, services, funding, peer comparison)"

# ---- General government + administration ----

select_board:
  # NOTE: this budget department is the staffed Select Board OFFICE (the Town
  # Administrator's shop), not the five elected board members. Keep that distinct.
  summary: >-
    This is the town's administrative office, led by the Town Administrator, who
    carries out the policies of the elected Select Board and coordinates the
    town's departments. The office handles business licensing, procurement (a
    Chief Procurement Officer), public-records requests, and accessibility (ADA)
    coordination. The elected Select Board itself is five members who set policy
    and appoint the Town Administrator; this budget covers the office and its
    staff, not the board members.
  source_url: https://marbleheadma.gov/selectboard-office/
  source_label: "Town of Marblehead, Select Board Office page (accessed 2026-08-04)"

finance:
  summary: >-
    Runs the town's financial operations: accounting and the general ledger,
    payroll, and treasury and collections (billing and collecting for town
    services). It also oversees the Assessors and the town's information systems,
    and publishes the Open Finance portal where residents can view
    budget-versus-actual data, vendor payments, and payroll.
  source_url: https://marbleheadma.gov/finance-department/
  source_label: "Town of Marblehead, Finance Department page (accessed 2026-08-04)"

assessor:
  summary: >-
    Values and taxes all real estate, motor vehicles, and boats in town, and
    prepares the data used to set the annual tax rate. It processes abatement
    applications from taxpayers who believe their property was overvalued and
    administers exemptions for seniors, veterans, blind residents, and surviving
    families of police officers and firefighters. Roughly 8,400 parcels are
    appraised through field inspections and deed processing, with records on an
    online property portal.
  source_url: https://marbleheadma.gov/assessors-office/
  source_label: "Town of Marblehead, Assessor's Office page (accessed 2026-08-04)"

town_clerk:
  summary: >-
    Maintains the town's birth, death, and marriage records and issues certified
    copies of vital records, plus burial permits, business certificates, dog
    licenses, and shellfish permits. The office keeps the town seal and attests
    documents that require town certification.
  source_url: https://marbleheadma.gov/town-clerk/
  source_label: "Town of Marblehead, Town Clerk page (accessed 2026-08-04)"

election_registration:
  summary: >-
    As the town's chief election official, the Town Clerk supervises voter
    registration and runs all elections, including polling places, ballots, and
    voting equipment. The office maintains the voting list, certifies nomination
    papers, administers campaign-finance filings, and staffs the Board of
    Registrars.
  source_url: https://marbleheadma.gov/town-clerk/
  source_label: "Town of Marblehead, Town Clerk page, elections section (accessed 2026-08-04)"

human_resources:
  summary: >-
    Assists town departments with personnel management, including labor
    relations, union contract administration, and hiring, working under the
    Town Administrator.
  source_url: https://marbleheadma.gov/hr/
  source_label: "Town of Marblehead, Human Resources page (accessed 2026-08-04)"

community_development:
  summary: >-
    Handles land-use planning, economic development, housing, historic
    preservation, and environmental conservation, and coordinates with state and
    regional agencies. It staffs five regulatory boards, the Zoning Board of
    Appeals, Planning Board, Conservation Commission, Old and Historic Districts
    Commission, and Design Review Board, and manages projects such as the Five
    Corners intersection improvement, the Rail Trail, and coastal-resilience work.
  source_url: https://marbleheadma.gov/development-planning/
  source_label: "Town of Marblehead, Community Development and Planning page (accessed 2026-08-04)"

building_inspection:
  summary: >-
    Reviews and inspects construction for compliance with the State Building
    Code, accessibility codes, and local zoning. It issues building, plumbing,
    electrical, and gas permits (filed online), performs the associated
    inspections, and handles code enforcement, coordinating with the Board of
    Health, Conservation Commission, Planning Board, and Zoning Board of Appeals.
  source_url: https://marbleheadma.gov/building-inspection/
  source_label: "Town of Marblehead, Building Inspection page (accessed 2026-08-04)"

public_buildings:
  summary: >-
    Maintains the town's municipal buildings, handling custodial services,
    heating and utilities, and repairs. (School buildings are maintained
    separately by the school district.)
  source_url: https://marbleheadma.gov/town-administrator/
  source_label: "Town of Marblehead, Town Administrator page (Public Buildings listed under departments overseen); no dedicated page (accessed 2026-08-04)"

parking_clerk:
  summary: >-
    Processes and adjudicates parking tickets: residents can appeal a citation
    within 21 days and the office schedules hearings, accepts fine payments in
    person and online, and manages snow-emergency towing, tracking impound
    locations and coordinating vehicle release with the tow contractor.
  source_url: https://marbleheadma.gov/parking-clerk/
  source_label: "Town of Marblehead, Parking Clerk page (accessed 2026-08-04)"

town_counsel:
  summary: >-
    Provides legal advice and representation to the town's boards, officials,
    and departments, and handles the town's litigation and contract review.
  source_label: "Standard municipal role; no dedicated Marblehead department page found (accessed 2026-08-04)"

planning_board:
  summary: >-
    The five-member elected board that approves land divisions creating new lots
    and reviews larger nonresidential and shoreline-area construction. It issues
    site-plan approvals and special permits under state and local zoning and
    subdivision law, meeting monthly with support from the Town Planner's office.
  source_url: https://marbleheadma.gov/town-planning-board/
  source_label: "Town of Marblehead, Planning Board page (accessed 2026-08-04)"

finance_committee:
  summary: >-
    The town's advisory body on financial matters. It reviews every department's
    budget and holds public hearings on warrant articles that involve spending,
    then issues a published report recommending for or against each financial
    article before Town Meeting. It also administers the town's Reserve Fund.
  source_url: https://marbleheadma.gov/finance-committee/
  source_label: "Town of Marblehead, Finance Committee page (accessed 2026-08-04)"

moderator:
  summary: >-
    The annually elected official who presides over Annual and Special Town
    Meetings, rules on questions of order, and declares the outcome of all votes.
    The Moderator also appoints residents to certain committees when Town Meeting
    directs.
  source_url: https://marbleheadma.gov/moderator/
  source_label: "Town of Marblehead, Town Moderator page (accessed 2026-08-04)"

# ---- Public safety (non-police/fire) ----

sealer_weights_measures:
  summary: >-
    Tests and certifies the accuracy of commercial measuring devices used in
    local businesses, such as retail scales and gas-station pumps, a role
    required of municipalities under state law.
  source_label: "State-mandated role under M.G.L. c. 98; no dedicated Marblehead department page found (accessed 2026-08-04)"

animal_inspector:
  summary: >-
    Animal control is run as a division of the Police Department. The Inspector
    of Animals keeps records on horses, dogs, goats, and poultry to ensure proper
    housing, and orders quarantine after the Animal Control Officer investigates
    a reported bite. Dog licensing is handled by the Town Clerk and requires a
    current rabies vaccination.
  source_url: https://marbleheadma.gov/animal-control/
  source_label: "Town of Marblehead, Animal Control page (accessed 2026-08-04)"

# ---- Public works, human services, enterprise ----

waste_collection:
  summary: >-
    Operates the town's Transfer Station, including a commercial pay-by-weight
    trash scale, and accepts certain recyclables such as marine shrink wrap.
  source_url: https://marbleheadma.gov/transfer-station/
  source_label: "Town of Marblehead, Transfer Station page (accessed 2026-08-04)"

curbside_collection:
  summary: >-
    Curbside trash and recycling are collected at the curb under contract by a
    private hauler (Republic Services), rather than by town crews.
  source_url: https://marbleheadma.gov/trash-recycling/
  source_label: "Town of Marblehead, Trash and Recycling page (accessed 2026-08-04)"

cemetery:
  summary: >-
    Handles burials and maintains Waterside and Harbor View cemeteries, sells
    burial plots and chapel niches to resident taxpayers, and processes marker
    foundations and lot transfers. It also keeps genealogical and historical
    gravestone records, including an 1873 gravestone inventory.
  source_url: https://marbleheadma.gov/cemetery/
  source_label: "Town of Marblehead, Cemetery Department page (accessed 2026-08-04)"

health:
  summary: >-
    The Board of Health department runs immunization and flu clinics,
    investigates communicable disease, and inspects food establishments, camps,
    and rental housing (including lead-paint inspection). It enforces tobacco and
    body-art rules, runs medication, sharps, and mercury disposal programs, tests
    beach water quality weekly in summer, and handles health education and
    emergency preparedness.
  source_url: https://marbleheadma.gov/health/
  source_label: "Town of Marblehead, Health Department page (accessed 2026-08-04)"

council_on_aging:
  summary: >-
    Serves Marblehead seniors with meal programs (a Tuesday sit-down lunch, Grab
    'n Go lunches, and Meals on Wheels), SHINE health-insurance counseling,
    outreach connecting residents to housing, home care, and transportation, and
    fitness, arts, and recreation programming including day and overnight trips.
  source_url: https://marbleheadma.gov/coa/
  source_label: "Town of Marblehead, Council on Aging page (accessed 2026-08-04)"

veterans_benefits:
  summary: >-
    Helps Marblehead veterans and their families apply for federal VA benefits
    (pension, disability, and health care) and Massachusetts Chapter 115
    benefits, and assists with low-cost VA prescriptions. The office also
    supports families at a veteran's death, coordinating military honors and flag
    presentation at burial, and collects worn flags for proper disposal.
  source_url: https://marbleheadma.gov/veterans-services/
  source_label: "Town of Marblehead, Veterans Services page (accessed 2026-08-04)"

rec_park:
  summary: >-
    Develops and runs recreation programs and operates the Judy and Gene Jacobi
    Community Center. It manages athletic fields and sports facilities, handles
    court reservations and room-rental permits, and maintains beaches,
    playgrounds, and public parks, under a Superintendent appointed by the
    Recreation and Parks Commission.
  source_url: https://marbleheadma.gov/recreation-parks/
  source_label: "Town of Marblehead, Recreation and Parks page (accessed 2026-08-04)"

water:
  summary: >-
    Delivers water to roughly 8,000 customers through two pump stations and two
    storage tanks, all supplied by the MWRA (originating from the Quabbin and
    Wachusett reservoirs). It runs cross-connection control, fluoridation
    monitoring, and lead testing in schools, and bills customers by the amount of
    water passing through their meter.
  source_url: https://marbleheadma.gov/water/
  source_label: "Town of Marblehead, Water Department page (accessed 2026-08-04)"

sewer:
  summary: >-
    Maintains more than 100 miles of sewer mains, over 3,000 structures, and 28
    pump stations serving about 7,800 buildings, pumping sewage to the South
    Essex Sewerage District treatment plant in Salem (Marblehead has been a
    member since 1972). It issues drain-layer licenses, administers sewer deduct
    meters, and bills sewer user fees.
  source_url: https://marbleheadma.gov/sewer/
  source_label: "Town of Marblehead, Sewer Department page (accessed 2026-08-04)"

harbor:
  summary: >-
    Operates four town vessels for patrol, firefighting, rescue, and
    environmental response during a May-through-October season, and assists the
    Coast Guard in water rescues. The office issues mooring permits and runs the
    mooring waiting lists, oversees public landings and floats at seven locations
    and dockage at Tucker's Wharf, runs a weekend pump-out service, and reviews
    pier-construction permits.
  source_url: https://marbleheadma.gov/harbormaster/
  source_label: "Town of Marblehead, Harbormaster page (accessed 2026-08-04)"

# ---- Other general government (accounting / non-service lines) ----

debt_service:
  summary: >-
    The town's scheduled principal and interest payments on money it has borrowed
    (bonds and notes) for capital projects. Not a staffed department.
  source_label: "Municipal budget line (FY27 Proposed Budget)"

memorial_veterans_day:
  summary: >-
    The budget line that funds the town's Memorial Day and Veterans Day
    observances, including parades, ceremonies, and flags.
  source_label: "Municipal budget line (FY27 Proposed Budget)"

reserve_fund:
  summary: >-
    A contingency fund the Finance Committee can transfer from during the year to
    cover extraordinary or unforeseen costs, so departments do not have to wait
    for Town Meeting. Not a staffed department.
  source_label: "Municipal budget line (FY27 Proposed Budget)"

other_general_government_dept:
  summary: >-
    A catch-all budget line for miscellaneous general-government costs not
    assigned to a specific department.
  source_label: "Municipal budget line (FY27 Proposed Budget)"

