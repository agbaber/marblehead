school_glover:
  summary: >-
    Glover Elementary School serves grades Pre-K through 3, one of Marblehead
    Public Schools' two Pre-K-3 elementary schools.
  source_url: https://glover.marbleheadschools.org
  source_label: "Marblehead Public Schools, Glover Elementary (accessed 2026-08-04)"
  deep_dive:
    url: /schools-budget.html
    label: "Marblehead schools budget: 24 years of spending and the FY27 breakdown"

school_village:
  summary: >-
    Village Elementary School serves grades 4 through 6, taking students after
    Brown or Glover, and is part of Marblehead Public Schools.
  source_url: https://village.marbleheadschools.org
  source_label: "Marblehead Public Schools, Village Elementary (accessed 2026-08-04)"
  deep_dive:
    url: /schools-budget.html
    label: "Marblehead schools budget: 24 years of spending and the FY27 breakdown"

school_middle:
  summary: >-
    Marblehead Veterans Middle School serves grades 7 and 8 and is part of
    Marblehead Public Schools.
  source_url: https://mvms.marbleheadschools.org
  source_label: "Marblehead Public Schools, Veterans Middle School (accessed 2026-08-04)"
  deep_dive:
    url: /schools-budget.html
    label: "Marblehead schools budget: 24 years of spending and the FY27 breakdown"

school_high:
  summary: >-
    Marblehead High School serves grades 9 through 12 and is part of Marblehead
    Public Schools.
  source_url: https://mhs.marbleheadschools.org
  source_label: "Marblehead Public Schools, Marblehead High School (accessed 2026-08-04)"
  deep_dive:
    url: /schools-budget.html
    label: "Marblehead schools budget: 24 years of spending and the FY27 breakdown"

school_athletics:
  summary: >-
    The district's athletics and sports program budget line for Marblehead Public
    Schools, rather than a single school building.
  source_url: https://www.marbleheadschools.org/
  source_label: "Marblehead Public Schools (accessed 2026-08-04)"
  deep_dive:
    url: /schools-budget.html
    label: "Marblehead schools budget: 24 years of spending and the FY27 breakdown"
