# FY27 Town Personnel Enrichment
#
# Funded salary lines per department for FY27, extracted from the MUNIS
# account-level budget detail published by the Town of Marblehead. This file
# is enrichment input for the org-chart page; the controller integrates it
# into _data/org_chart.yml later. DO NOT consume directly without reading
# the caveats below.
#
# ---------------------------------------------------------------------------
# SOURCES (every number is traceable)
# ---------------------------------------------------------------------------
#
# Primary source for FY27 funded positions and salary appropriations:
#   "FY '27 Proposed Budget vs. FY '26 w/ Acct Details" (MUNIS export)
#   https://marbleheadma.gov/wp-content/uploads/2026/05/FY27-Proposed-Budget-vs-FY26-w-Acct-Details.xlsx
#   Single sheet "FY27 BUDGET ACCT DETAILS", 692 rows, account-object level
#   (MUNIS org / object / description columns). FY26 budgeted vs FY27 proposed.
#
# Cross-walk source for FY26 filled-position counts and titles:
#   /home/claude/marblehead/.dev/worktree/calm-garden/data/employee_count_FY2008-2026.xls
#   Sheet "FY2026", 1106 rows, dept # / name / title / pay-frequency columns.
#   "Frequency" is pay periods per year (53/52 = year-round; 26 = half-year;
#   42/39/22 = academic year; 4 = quarterly; 2-3 = seasonal). Frequency is
#   NOT FTE. Headcount-per-title is the only FTE proxy this file offers.
#
# Editorial/cuts narrative source (NOT a position roster, but corroborates
# the FY26-to-FY27 deltas below):
#   "FY27 Override Presentation FINAL" (2026-04-15 Select Board)
#   https://marbleheadma.gov/wp-content/uploads/2025/10/2026-04-15-Override-Presentation-FINAL.pdf
#   Page "Loss of Town Services by Department" and the Tier 1/2/3 comparison
#   matrix.
#
# Summary appropriations source (department totals match MUNIS Excel totals):
#   "Proposed FY27 Balanced Budget With No Override"
#   https://marbleheadma.gov/wp-content/uploads/2026/04/PROPOSED-FY27-BALANCED-BUDGET-WITH-NO-OVERRIDE.pdf
#   8 pages. Department-level appropriation table (Mass. General Laws c.41
#   sec.60 required estimate). No personnel detail.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE DOES NOT CONTAIN
# ---------------------------------------------------------------------------
#
# 1. No explicit FTE counts. The Town of Marblehead does not publish an FY27
#    "Personnel Detail" or "Authorized Positions" schedule. The MUNIS Excel
#    is the closest published artifact, and it lists salary OBJECTS (one row
#    per pay code per department), not positions. For singleton roles
#    ("Department Head", "Senior Clerk") one object = one position. For
#    bargaining-unit pool lines (Firefighters, Patrolmen, HEOs, Groundskeepers,
#    Park Maintenance) one object can fund many positions. Headcount per pool
#    is shown below as "fy26_filled_count" from the FY26 payroll roster,
#    flagged as a BASELINE not an FY27 authorization.
#
# 2. No water, sewer, harbormaster, or MMLD positions. These are enterprise
#    funds whose salaries do not appear in the General Fund MUNIS Excel.
#    Enterprise fund appropriations show up only as lump-sum totals in the
#    FY27 balanced budget appropriation table.
#
# 3. No school positions. The schools appropriation is a single lump sum
#    line in the General Fund; building-level personnel come from the FY27
#    school budget packet (data/schools/sc-meetings-fy26/ ...) and are
#    already represented in _data/org_chart.yml.
#
# 4. No individual salary band detail. The MUNIS Excel shows budgeted dollars
#    per object code, which for multi-position lines is the pool total, not
#    a per-position range. The Town's Classification & Pay Schedule (Town
#    Bylaws Chapter 121) sets per-grade ranges but is not published as a
#    standalone document on marbleheadma.gov; it lives only in the bylaws.
#
# ---------------------------------------------------------------------------
# HOW TO READ THE departments LIST
# ---------------------------------------------------------------------------
#
# matches_org_chart_name: the name in _data/org_chart.yml > town > departments
#   to join against. Some MUNIS departments don't have a matching org_chart
#   entry (e.g. CURBSIDE COLLECTION is brand new in FY27); those are flagged.
#
# positions[]: one row per MUNIS object code in the 5110xx (named-role) range,
#   plus selected 511xxx pool lines (Firefighters, Patrolmen, etc.). Stipends,
#   longevity, holiday pay, overtime, and similar line items are excluded
#   from positions[] (they're employment costs, not positions) but rolled
#   into fy27_salary_total.
#
# Each position row:
#   munis_object  - 6-digit MUNIS object code (e.g. 511003 = Department Head)
#   title         - description as printed in the MUNIS Excel
#   fy26_amount   - FY26 budgeted dollars for this line
#   fy27_amount   - FY27 proposed dollars for this line
#   status        - "continuing" | "eliminated" | "new" | "reduced" | "added"
#                   Computed from fy27_amount vs fy26_amount; an explicit
#                   --100% delta = eliminated, $0->$ = new, < -10% = reduced.
#   fy26_filled_count - For pool lines, the count of FY26 filled positions
#                       with this title from the FY2026 employee roster.
#                       Singleton lines (Dept Head etc.) are 1 by definition.
#   note          - free-text note when the line needs context (e.g. shared
#                   with another dept, partial-year reduction).
#
# fy27_salary_total - sum of all 51xxxx and 517xxx and 519xxx object lines
#   in this department in the MUNIS Excel. This is the Town's published FY27
#   salary appropriation for the department (matches the "Salaries" column
#   of the FY27 Balanced Budget appropriation table).
#

source:
  primary:
    url: "https://marbleheadma.gov/wp-content/uploads/2026/05/FY27-Proposed-Budget-vs-FY26-w-Acct-Details.xlsx"
    title: "FY27 Proposed Budget vs FY26 w/ Acct Details"
    publisher: "Town of Marblehead Finance Department (MUNIS export)"
    sheet: "FY27 BUDGET ACCT DETAILS"
    accessed: "2026-06-15"
    fiscal_year: "FY27"
  cross_walk:
    url: "(local) data/employee_count_FY2008-2026.xls"
    title: "Employee Earnings History FY2008-2026"
    sheet: "FY2026"
    publisher: "Town of Marblehead payroll system (MUNIS export)"
    note: >-
      Used only to derive fy26_filled_count for multi-position pool lines.
      Frequency column is pay periods per year, not FTE.
  narrative:
    url: "https://marbleheadma.gov/wp-content/uploads/2025/10/2026-04-15-Override-Presentation-FINAL.pdf"
    title: "FY27 Override Presentation FINAL (Select Board, 2026-04-15)"
    pages: "Loss of Town Services by Department; Tier 1/2/3 Comparison"
    note: >-
      Confirms position-level cuts in the FY27 balanced (no-override) budget
      and what Tier 1/2/3 override votes would restore or add. Useful for
      narrative context; counts are not perfectly aligned with the MUNIS
      account lines because the presentation buckets several cuts together.

# Headline figure published by the town for the no-override FY27 personnel cut.
# Source: FinCom Report 2026, page on FY27 reductions, and Override Presentation
# "FTE Summary: Cuts 21.5 Positions" line. Used as a sanity check, NOT as a
# per-position substitute.
fy27_headline:
  town_position_cuts: 22
  town_position_cuts_basis: >-
    FinCom Report 2026 (FY27 page): "The reduction of 22 FTEs, representing a
    12% reduction in the total Town workforce funded by the General Fund."
    The Override Presentation rounds this to "21.5 positions cut."
  school_position_cuts: 18.25
  school_position_cuts_basis: >-
    FinCom Report 2026: "18.25 FTEs, representing a 4% reduction in School
    department headcount." Schools are a lump-sum appropriation and not broken
    out in this enrichment file.

