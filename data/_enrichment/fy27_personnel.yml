# ---------------------------------------------------------------------------
# DEPARTMENTS NOT COVERED BY THIS FILE (and why)
# ---------------------------------------------------------------------------
#
# Water Department, Sewer Department, Marblehead Municipal Light Department,
# and Harbormaster are enterprise funds with their own appropriations,
# governed by separate elected commissions (Water & Sewer Commission, Light
# Commission, Harbors & Waters Board respectively). Their personnel detail
# does not appear in the General Fund MUNIS Excel and would need to be
# pulled from:
#   - Water/Sewer: the Water & Sewer Commission's own budget submission
#     (typically published only as part of the Annual Report or commission
#     minutes; no standalone PDF on marbleheadma.gov as of 2026-06-15).
#   - MMLD: Light Department budget posted by the Light Commission; not
#     covered on marbleheadma.gov (separate site, marbleheadelectric.com).
#   - Harbormaster: enterprise fund; staff appears in the FY26 payroll
#     roster (dept 652 HARBORMASTER, 17 employees including seasonal)
#     but not in the General Fund MUNIS Excel.
#
# Schools (Admin & Systemwide, all 5 buildings, Revolving Fund, Grants):
# School Department is a single lump-sum appropriation in the General Fund
# MUNIS Excel. Building-level personnel detail comes from the FY27 school
# budget packet (data/schools/sc-meetings-fy26/agenda-and-materials-
# 2-5-2026-fy27-budget-packet.txt) and is already reflected in
# _data/org_chart.yml > schools > buildings and > central_office.
#
# Parking Clerk: appears in the FY27 appropriation table as an expense-only
# line ($8,400 FY26 = FY27). No MUNIS salary lines; the Parking Clerk
# function rolls into the Select Board Office org-chart entry.
#
# Sealer of Weights and Measures: appropriation table line, $1,200 FY27
# (continuing); not a salaried position with a MUNIS personnel object.
# Listed in the FY26 payroll roster as a stipend role under Dept 241
# (Building Commissioner).
