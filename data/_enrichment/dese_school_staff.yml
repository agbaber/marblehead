# DESE EPIMS school staffing for Marblehead Public Schools, SY2025-26.
#
# Source: Massachusetts Department of Elementary and Secondary Education
# (DESE) Education Personnel Information Management System (EPIMS),
# accessed via the Education-to-Career Hub Socrata API.
#
# Endpoint:
#   https://educationtocareer.data.mass.gov/resource/j5ue-xkfn.json
#     ?$where=dist_code='01680000' AND sy='2026'
#
# Mirrored on the public DESE School and District Profiles site at
# https://profiles.doe.mass.edu/profiles/general.aspx?orgcode=01680000
# (teacher FTE on the per-school Teacher Data pages matches the
# Instructional Staff totals below to one decimal place).
#
# School year notation: DESE reports use sy=2026 to mean the 2025-26
# school year (FY26). The district total of 430.2 FTE here matches
# data/dese_total_educator_fte.csv and the Marblehead rows in
# data/dese_peer_staffing_SY2026.csv, both of which trace to the same
# EPIMS extract.
#
# FTE basis: EPIMS reports educator full-time equivalents. Per-school
# rows cover staff assigned to a specific building; district-only rows
# (Superintendent, Assistant Superintendents, Business Official,
# district-wide administrators, Information Services district team,
# School Resource Officer, district health staff, etc.) sit at the
# district level and are not allocated to a school. The five buildings
# sum to 397.7 FTE; the remaining 32.5 FTE is the district-only layer.
#
# Role labels are reported verbatim from EPIMS (e.g. 'Teacher - support
# content instruction', 'Tutor', 'School Adjustment Counselor --
# Non-Special Education') so they cross-reference cleanly with the
# state taxonomy. EPIMS-reported 'Tutor' headcounts in Marblehead
# include staff funded under tutoring/intervention lines and are not
# directly comparable to one-to-one private tutoring.
#
# accessed: 2026-06-15
# fiscal_year: 'FY26 (SY2025-26)'
# source_url: 'https://profiles.doe.mass.edu/profiles/general.aspx?orgcode=01680000'

