name: Refresh checkbook CSV (FY26 archive)

# Weekly refresh of the FY26 checkbook archive. The FY26 ledger stopped
# moving in Sep 2026 but the budget-side FY26 actuals still pick up
# close adjustments and nothing else refreshes them: this job fetches
# the FY26 operating-budget CSV, rebuilds the actuals, and re-crawls
# the budget drill only when those actuals moved. Delete this workflow
# once the FY26 ACFR is published (expected ~Jan 2027); the page then
# freezes on its last snapshot as the permanent archive. Kept separate
# from checkbook-refresh.yml so a stuck FY26 PR never blocks the live
# current-year refresh.

on:
  schedule:
    # Sundays 11:00 UTC. Was daily; the output is a verification stamp
    # plus the occasional close adjustment, and the drill crawl (754
    # portal queries) only runs when the actuals moved.
    - cron: '0 11 * * 0'
  workflow_dispatch:

concurrency:
  group: checkbook-refresh-fy26
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Progress prints from the python scripts reach the log as they
      # happen instead of only at exit, so a killed crawl still shows how
      # far it got (the 2026-10-21 runs showed nothing).
      PYTHONUNBUFFERED: '1'
    # The crawl step has its own 25-minute budget below; the rest of the
    # job is ~1 min of fetches plus up to 15 min waiting for the merge.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.INGEST_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Close any leftover FY26 auto PR (a prior run that never merged)
        env:
          GH_TOKEN: ${{ secrets.INGEST_PAT }}
        run: |
          set -euo pipefail
          gh label create auto-checkbook-fy26 --color d62728 \
            --description "Weekly auto-refresh of the FY26 checkbook archive" 2>/dev/null || true
          node scripts/ci/auto_pr.mjs gate auto-checkbook-fy26

      - name: Fetch + redact FY26 export, refresh FY26 budget CSV, rebuild actuals
        run: |
          set -euo pipefail
          python3 scripts/fetch_checkbook_export.py --year 2026
          python3 scripts/build_checkbook_performance.py --year 2026 --out data/checkbook_performance_FY26.json
          # The FY26 operating-budget CSV is the input to budget_actual; the
          # daily budget-refresh.yml only fetches the current FY, and until
          # 2026-10-21 nothing refreshed the FY26 copy after Jun 30.
          python3 scripts/fetch_operating_budget.py --year 2026
          python3 scripts/build_budget_actual.py --year 2026
          # data/checkbook_redaction_disclosure.json is a single shared file
          # that the live FY27 daily job also rewrites. Leave it to that job
          # so the two workflows don't flip-flop it into daily no-op PRs.
          git checkout -- data/checkbook_redaction_disclosure.json

      - name: Re-crawl budget drill (skipped when the FY26 actuals are unchanged)
        id: crawl
        # 754 sequential cross-tab queries: 8-16 min normally, but on
        # 2026-10-21 the portal answered each in 4-18 s and the crawl blew
        # through 40 min. A step budget keeps the CSV + actuals landing
        # even when the drill cannot; the final step then turns the run
        # red so the stale drill is visible. The crawler only writes its
        # output at the end, so a killed crawl leaves the committed file
        # (and its actuals_sha256) untouched and the next run retries.
        timeout-minutes: 25
        continue-on-error: true
        run: python3 scripts/crawl_budget_drill.py --year 2026 --skip-if-unchanged

      - name: Prune superseded FY26 dated CSVs
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          dash = json.loads(Path('_data/checkbook_fy26.json').read_text())
          keep = Path('data') / dash['csv_filename']
          for old in Path('data').glob('checkbook_FY26_*.csv'):
              if old != keep:
                  old.unlink(); print(f'removed {old}')
          PY

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          git add -A data/ _data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, open PR, auto-merge
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INGEST_PAT }}
        run: |
          set -euo pipefail
          as_of=$(python3 -c "import json;print(json.load(open('_data/checkbook_fy26.json'))['as_of'])")
          branch="bot/checkbook-fy26-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "marblehead-bot"
          git config user.email "noreply@marbleheaddata.org"
          git checkout -b "$branch"
          git commit -m "Refresh FY26 checkbook archive through ${as_of}"
          git push -u origin "$branch"
          pr_url=$(gh pr create \
            --title "Refresh FY26 checkbook archive through ${as_of}" \
            --body "Weekly FY26 archive refresh. Auto-merged; same redaction + required checks as the live job. The workflow waits for the merge and re-runs a cancelled check once. Delete this workflow once the FY26 ACFR is out." \
            --label auto-checkbook-fy26 --base main --head "$branch")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh pr merge "$pr_url" --auto --squash --delete-branch

      - name: Wait for auto-merge (re-run a cancelled required check once; fail loudly otherwise)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INGEST_PAT }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: node scripts/ci/auto_pr.mjs await-merge "$PR_URL" --minutes 15

      - name: Fail the run if the drill crawl did not finish (the actuals above still landed)
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "::error::crawl_budget_drill.py did not finish inside its 25-minute step budget. The operating-budget CSV and budget_actual changes were still committed; the drill keeps its previous snapshot and the next Sunday run re-crawls because its actuals_sha256 is stale."
          exit 1
