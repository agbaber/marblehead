name: Site Tests

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Normal run is ~2 min. 20 leaves room for a slow Playwright CDN
    # download on a cache miss without the 10-minute cliff that
    # cancelled the smoke check on PRs #1150 and #1287.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - run: npm install

      # Unit tests for CI helpers (scripts/ci). Fast; runs before the
      # browser install so a helper regression fails in seconds.
      - run: npm run test:ci

      # Cache the Chromium build Playwright downloads (~150 MB) so the
      # usual run never touches the Playwright CDN.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No --with-deps: that flag apt-installs ~80 MB of font packages on
      # every run, and the Azure apt mirror stalling inside it is what
      # pushed PR #1150 (Aug 18) and PR #1287 (Oct 9) past the job
      # timeout and wedged the checkbook refresh for 10+ days each.
      # ubuntu-latest already ships Chromium's shared libraries.
      - run: npx playwright install chromium

      - name: Start local server
        run: npx serve _site -p 4000 &

      - name: Wait for server
        run: npx wait-on http://localhost:4000 --timeout 15000

      - name: Run smoke tests
        env:
          SITE: http://localhost:4000
        run: node tests/smoke-test.mjs

      - name: Run explore tests (non-blocking)
        continue-on-error: true
        env:
          SITE: http://localhost:4000
        run: node tests/explore-test.mjs
