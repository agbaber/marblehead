# TEMPORARY verification workflow — proves vimeo_embed_fetch.py works from a
# fresh GitHub Actions IP against the real July 28 Board of Health meeting
# (vimeo id 1214629503), the one the live pipeline reports as "no caption
# track". No commits, no enrichment, no merge. Delete before merging the PR.
name: Verify Vimeo embed fetch (temp)

on:
  workflow_dispatch:
  push:
    branches: [fix/vimeo-embed-caption-fetch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --user 'curl_cffi>=0.10,<0.16'
      - name: Fetch real 7-28 BOH captions from a fresh CI IP
        run: |
          set -euo pipefail
          python3 scripts/transcripts/vimeo_embed_fetch.py 1214629503 --out /tmp/boh728.vtt
          echo "--- bytes ---"
          wc -c /tmp/boh728.vtt
          echo "--- first caption lines ---"
          head -12 /tmp/boh728.vtt
