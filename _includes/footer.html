<footer class="footer">
  <nav class="footer-links" aria-label="Site footer">
    <a href="{{ '/' | relative_url }}about.html">About</a>
    <a href="{{ '/' | relative_url }}privacy.html">Privacy</a>
    <a href="{{ '/' | relative_url }}verify-me.html" id="footer-account">Account</a>
    <a href="https://github.com/agbaber/marblehead">Source</a>
    <a href="https://github.com/agbaber/marblehead/issues/new?title=Correction%3A+" target="_blank" rel="noopener">Report an error</a>
  </nav>
  <script>
    // Swap the footer Account link to /profile.html when signed in.
    (function () {
      try {
        var el = document.getElementById('footer-account');
        if (el && localStorage.getItem('verify_jwt')) {
          el.setAttribute('href', '/profile.html');
        }
      } catch (e) { /* localStorage blocked */ }
    })();
  </script>
  <p class="footer-meta"><a href="{{ '/' | relative_url }}about.html">Built by a Marblehead resident</a> &middot; Updated {{ site.last_updated }}</p>
  <p class="footer-version"><a href="/data/release-notes.html">v{{ site.version }}</a></p>
</footer>
