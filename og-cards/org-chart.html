<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .tree { margin-top: 20px; max-width: 1060px; }
    .row { display: flex; justify-content: center; gap: 80px; margin-bottom: 14px; }
    .pill {
      background: var(--bg-lift);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 20px;
      color: var(--text);
    }
    .pill.voters {
      background: linear-gradient(180deg, rgba(226,107,82,0.22), rgba(226,107,82,0.06));
      border-color: var(--c-buoy);
      color: var(--text);
    }
    .pill.board { color: var(--text); border-color: var(--c-teal); background: rgba(91,168,184,0.16); }
    .col { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 460px; }
    .label { font-size: 14px; color: var(--text-sub); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
    .branches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .leaf {
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 15px;
      color: var(--text-mid);
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-eyebrow">
      <span class="mark"></span>
      <span>Tool</span>
      <span class="sep">/</span>
      <span>Org chart</span>
    </header>

    <div>
      <h1 class="card-headline">Two parallel governments <em>run Marblehead.</em></h1>
      <div class="tree">
        <div class="row"><div class="pill voters">Registered voters</div></div>
        <div class="row">
          <div class="col">
            <div class="label">Town side</div>
            <div class="pill board">Select Board</div>
            <div class="branches">
              <div class="leaf">Admin &amp; Finance</div>
              <div class="leaf">Public Safety</div>
              <div class="leaf">Public Works</div>
              <div class="leaf">Land Use &amp; Health</div>
              <div class="leaf">Community Services</div>
            </div>
          </div>
          <div class="col">
            <div class="label">School side</div>
            <div class="pill board">School Committee</div>
            <div class="branches">
              <div class="leaf">Central Office</div>
              <div class="leaf">Buildings</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="card-foot">
      <span class="url">marbleheaddata.org/org-chart</span>
      <span>FY26 headcount, named roles</span>
    </footer>
  </main>
</body>
</html>
