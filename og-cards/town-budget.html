<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .bar {
      width: 100%;
      max-width: 1060px;
      height: 72px;
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      margin-top: 22px;
    }
    .seg {
      display: flex;
      align-items: center;
      padding: 0 16px;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .seg.schools  { background: var(--c-buoy); }
    .seg.town     { background: var(--c-teal); }
    .seg.benefits { background: var(--c-brass); color: #0A1A24; }
    .seg.debt     { background: var(--c-sage); color: #0A1A24; }
    .seg.other    { background: #44606E; }

    .legend {
      margin-top: 18px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      font-size: 17px;
      color: var(--text-mid);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 8px;
      border-radius: 2px;
      vertical-align: -1px;
    }
    .legend .schools::before  { background: var(--c-buoy); }
    .legend .town::before     { background: var(--c-teal); }
    .legend .benefits::before { background: var(--c-brass); }
    .legend .debt::before     { background: var(--c-sage); }
    .legend .other::before    { background: #44606E; }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-eyebrow">
      <span class="mark"></span>
      <span>Tool</span>
      <span class="sep">/</span>
      <span>Town budget</span>
    </header>

    <div>
      <h1 class="card-headline"><em>$122.76M</em>, line by line.</h1>
      <div class="bar">
        <div class="seg schools"  style="flex: 47.6">Schools $47.6M</div>
        <div class="seg town"     style="flex: 28">Town departments</div>
        <div class="seg benefits" style="flex: 18">Benefits</div>
        <div class="seg debt"     style="flex: 10">Debt</div>
        <div class="seg other"    style="flex: 19">Other</div>
      </div>
      <div class="legend">
        <span class="schools">Schools</span>
        <span class="town">Town departments</span>
        <span class="benefits">Benefits</span>
        <span class="debt">Debt</span>
        <span class="other">Other</span>
      </div>
    </div>

    <footer class="card-foot">
      <span class="url">marbleheaddata.org/town-budget</span>
      <span>FY27 Proposed (No Override)</span>
    </footer>
  </main>
</body>
</html>
