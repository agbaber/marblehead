<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .bar {
      width: 100%;
      max-width: 1060px;
      height: 88px;
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15,42,61,.10);
    }
    .seg {
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: white;
      font-weight: 700;
      font-size: 21px;
      white-space: nowrap;
      overflow: hidden;
    }
    .seg.schools  { background: var(--c-buoy); flex: 47.6; }
    .seg.other    { background: var(--c-navy); flex: 25.0; }
    .seg.safety   { background: var(--c-teal); flex: 11.9; }
    .seg.water    { background: var(--c-sage); flex: 6.9; }
    .seg.works    { background: var(--c-plum); flex: 6.9; }
    .seg.rest     { background: #93A4B0;        flex: 24.5; }

    .legend {
      margin-top: 22px;
      display: flex;
      gap: 28px;
      font-size: 21px;
      color: var(--c-mid);
      flex-wrap: wrap;
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border-radius: 3px;
      vertical-align: -2px;
    }
    .legend .schools::before { background: var(--c-buoy); }
    .legend .other::before   { background: var(--c-navy); }
    .legend .safety::before  { background: var(--c-teal); }
    .legend .water::before   { background: var(--c-sage); }
    .legend .works::before   { background: var(--c-plum); }
    .legend .rest::before    { background: #93A4B0; }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-mark">marbleheaddata.org</header>
    <h1 class="card-headline">$122.76M, line by line.</h1>
    <div class="card-visual">
      <div class="bar">
        <div class="seg schools">Schools $47.6M</div>
        <div class="seg other">Benefits &amp; debt</div>
        <div class="seg safety">Safety</div>
        <div class="seg water">Water</div>
        <div class="seg works">DPW</div>
        <div class="seg rest">Other</div>
      </div>
      <div class="legend">
        <span class="schools">Schools $47.6M</span>
        <span class="other">Benefits &amp; debt $25.0M</span>
        <span class="safety">Public safety $11.9M</span>
        <span class="water">Water $6.9M</span>
        <span class="works">Public works $6.9M</span>
        <span class="rest">Other $24.5M</span>
      </div>
    </div>
    <footer class="card-foot">/town-budget &middot; FY27 Proposed (No Override) + Enterprise</footer>
  </main>
</body>
</html>
