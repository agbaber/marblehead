<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .row { display: grid; grid-template-columns: 1fr auto; gap: 36px; align-items: end; margin-top: 18px; }
    .dots {
      display: grid;
      grid-template-columns: repeat(43, 1fr);
      gap: 5px;
      max-width: 700px;
    }
    .dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
    }
    .dot.teacher { background: var(--text); }
    .dot.paratut { background: var(--c-teal); }
    .dot.support { background: var(--c-navy); }
    .dot.admin   { background: var(--c-plum); }
    .dot.sped    { background: var(--c-brass); }

    .legend {
      margin-top: 18px;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-size: 16px;
      color: var(--text-mid);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
      vertical-align: 0;
    }
    .legend .teacher::before { background: var(--text); }
    .legend .paratut::before { background: var(--c-teal); }
    .legend .support::before { background: var(--c-navy); }
    .legend .admin::before   { background: var(--c-plum); }
    .legend .sped::before    { background: var(--c-brass); }

    .ratio {
      font-variant-numeric: tabular-nums;
    }
    .ratio .big {
      font-size: 96px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--c-buoy);
    }
    .ratio .lbl {
      font-size: 18px;
      color: var(--text-mid);
      margin-top: 12px;
      max-width: 220px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-eyebrow">
      <span class="mark"></span>
      <span>Tool</span>
      <span class="sep">/</span>
      <span>School staffing</span>
    </header>

    <div>
      <h1 class="card-headline">What <em>430 school positions</em> actually do.</h1>
      <div class="row">
        <div>
          <div class="dots" id="dots"></div>
          <div class="legend">
            <span class="teacher">Teachers 169</span>
            <span class="paratut">Paras + tutors 88</span>
            <span class="support">Co-teachers + support 82</span>
            <span class="admin">Admin + clerical 53</span>
            <span class="sped">Counselors + nurses 38</span>
          </div>
        </div>
        <div class="ratio">
          <div class="big">5.6</div>
          <div class="lbl">Marblehead students per staff member. Melrose: 7.8.</div>
        </div>
      </div>
      <script>
        const dots = document.getElementById('dots');
        const buckets = [['teacher',169],['paratut',88],['support',82],['admin',53],['sped',38]];
        for (const [c,n] of buckets) for (let i=0;i<n;i++) { const d=document.createElement('div'); d.className='dot '+c; dots.appendChild(d); }
      </script>
    </div>

    <footer class="card-foot">
      <span class="url">marbleheaddata.org/inside-school-staffing</span>
      <span>Source: state EPIMS, 2025–26</span>
    </footer>
  </main>
</body>
</html>
