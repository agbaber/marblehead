<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .ledger {
      width: 100%;
      max-width: 1060px;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    .ledger td {
      padding: 14px 20px;
      border-top: 1px solid var(--c-border);
      font-size: 26px;
      color: var(--c-mid);
    }
    .ledger td.amt { text-align: right; font-weight: 700; color: var(--c-text); }
    .ledger tr.total td {
      border-top: 3px solid var(--c-navy);
      color: var(--c-navy);
      font-weight: 800;
      font-size: 30px;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-mark">marbleheaddata.org</header>
    <h1 class="card-headline">Every check the town wrote.</h1>
    <div class="card-visual">
      <table class="ledger">
        <tr><td>Schools</td><td class="amt">$37.4M</td></tr>
        <tr><td>Light Department</td><td class="amt">$13.2M</td></tr>
        <tr><td>Public Safety</td><td class="amt">$9.9M</td></tr>
        <tr><td>Debt Service</td><td class="amt">$9.3M</td></tr>
        <tr class="total"><td colspan="2">FY26 vendor checks, every line traceable</td></tr>
      </table>
    </div>
    <footer class="card-foot">/checkbook</footer>
  </main>
</body>
</html>
